version: '3.8'

services:
  sensor-control-service:
    build:
      context: ./sensor-control-service
      dockerfile: Dockerfile
    container_name: sensor-control-service
    ports:
      - "8000:8000"
      - "9002:9002"
    environment:
      - QUARKUS_HTTP_PORT=8000
      - QUARKUS_GRPC_SERVER_PORT=9002
      - QUARKUS_LOG_LEVEL=INFO
    networks:
      - traffic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  traffic-light-service:
    build:
      context: ./traffic-light-service
      dockerfile: Dockerfile
    container_name: traffic-light-service
    ports:
      - "8002:8002"
      - "9003:9003"
    environment:
      - QUARKUS_HTTP_PORT=8002
      - QUARKUS_GRPC_SERVER_PORT=9003
      - QUARKUS_LOG_LEVEL=INFO
    networks:
      - traffic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  traffic-control-service:
    build:
      context: ./traffic-control-service
      dockerfile: Dockerfile
    container_name: traffic-control-service
    ports:
      - "8001:8001"
      - "9001:9001"
    environment:
      - QUARKUS_HTTP_PORT=8001
      - QUARKUS_GRPC_SERVER_PORT=9001
      - QUARKUS_GRPC_CLIENTS_SENSOR_SERVICE_HOST=sensor-control-service
      - QUARKUS_GRPC_CLIENTS_SENSOR_SERVICE_PORT=9002
      - QUARKUS_GRPC_CLIENTS_TRAFFIC_LIGHT_SERVICE_HOST=traffic-light-service
      - QUARKUS_GRPC_CLIENTS_TRAFFIC_LIGHT_SERVICE_PORT=9003
      - QUARKUS_LOG_LEVEL=INFO
    depends_on:
      - sensor-control-service
      - traffic-light-service
    networks:
      - traffic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  traffic-network:
    driver: bridge

