# HTTP Configuration
quarkus.http.port=8001
quarkus.grpc.server.use-separate-server=false

# CORS Configuration - Allow frontend to call backend APIs
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# gRPC Client Configuration - Sensor Service
quarkus.grpc.clients.sensor-service.host=localhost
quarkus.grpc.clients.sensor-service.port=8002

# gRPC Client Configuration - Traffic Light Service
quarkus.grpc.clients.traffic-light-service.host=localhost
quarkus.grpc.clients.traffic-light-service.port=8003

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.mihailmerkov.sctms.traffic".level=DEBUG
